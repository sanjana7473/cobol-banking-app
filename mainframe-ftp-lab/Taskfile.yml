version: '3'

vars:
  PROJECT_NAME: mainframe-lab
  DOCKER_COMPOSE_FILE: docker/docker-compose.yaml

tasks:


  start:
    desc: Start the mainframe lab services
    summary: |
      Starts both TK4- mainframe simulator and FTP server.
      Creates directories if they don't exist.
    cmds:
      - echo "🚀 Starting services..."
      - ./start-lab.sh
    silent: false

  stop:
    desc: Stop the mainframe lab services
    summary: |
      Stops all containers but preserves data in mounted volumes.
    cmds:
      - echo "🛑 Stopping services..."
      - ./stop-lab.sh
    silent: false

  status:
    desc: Check the status of services
    summary: |
      Shows the current status of all containers and services.
    cmds:
      - echo "📊 Service Status:"
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} ps
    silent: false

  test-hello:
    desc: Submit hello world JCL job
    summary: |
      Submits the hello.jcl job to the mainframe for testing.
    cmds:
      - echo "📤 Submitting Hello World JCL..."
      - ./submit-hello.sh
  
    silent: false

  test-ftp:
    desc: Test FTP server with SITE/QUOTE commands
    summary: |
      Tests FTP functionality including SITE and QUOTE commands.
    cmds:
      - echo "🌐 Testing FTP server..."
      - ./test-ftp.sh
    silent: false






  logs:
    desc: Show container logs
    summary: |
      Display logs from running containers.
    cmds:
      - echo "📋 Container logs:"
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} logs
    silent: false


  teardown:
    desc: Complete teardown of the lab
    summary: |
      Stops all services, removes containers, and cleans up all data.
      WARNING: This will delete all job outputs and FTP files!
    cmds:
      - echo "💥 Tearing down lab environment..."
      - task: stop
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down -v --remove-orphans
      - echo "✅ Teardown completed!"
    silent: false




  console:
    desc: Open Hercules web console
    summary: |
      Opens the TK4 Hercules web console in your browser.
    cmds:
      - echo "🌐 Opening Hercules console at http://localhost:8038"
      - 'open http://localhost:8038 || echo "Manual open: http://localhost:8038"'
    silent: false

  submit:
    desc: Submit a JCL job (specify JCL_FILE variable)
    summary: |
      Submit any JCL file to the mainframe. Usage: task submit JCL_FILE=filename.jcl
    cmds:
      - 'echo "📤 Submitting {{.JCL_FILE | default "hello.jcl"}}..."'
      - 'cat ./jcl/{{.JCL_FILE | default "hello.jcl"}} | nc localhost 3505'
      - 'echo "✅ JCL submitted! Check web console: http://localhost:8038"'
    silent: false

  exec-tk4:
    desc: Execute command in TK4 container
    summary: |
      Open a shell session in the TK4 mainframe container.
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} exec tk4 /bin/bash
    silent: false

  exec-ftp:
    desc: Execute command in FTP container
    summary: |
      Open a shell session in the FTP server container.
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} exec ftp /bin/sh
    silent: false

  help:
    desc: Show available tasks with descriptions
    summary: |
      Display this help information.
    cmds:
      - task --list
    silent: false

  default:
    desc: Default task - show help
    cmds:
      - task: help
    silent: true